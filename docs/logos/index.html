<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance OS · Logos</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f5; --fg:#111; --muted:#666; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0a0a; --fg:#f5f5f5; --muted:#9a9a9a; --card:#171717; } }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  figure { margin:0; background:var(--card); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:12px; align-items:center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  figure img { width: 128px; height: 128px; }
  .sizes { display:flex; gap:10px; align-items:end; }
  .sizes img { border-radius: 22%; }
  figcaption { text-align:center; font-size: 14px; }
  figcaption b { display:block; font-size: 15px; margin-bottom: 2px; }
  figcaption span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Finance OS · propuestas de logo</h1>
  <p class="lead">Cinco propuestas (2.5.0). <b>Elegida: 1 · Bloques</b>. Guía oficial en <code>docs/marca/README.md</code>.</p>
  <div class="grid">
    <figure><img src="1-bloques.svg" alt=""><div class="sizes"><img src="1-bloques.svg" width="48" alt=""><img src="1-bloques.svg" width="32" alt=""><img src="1-bloques.svg" width="20" alt=""></div><figcaption><b>1 · Bloques</b><span>Escalera de bloques que sube; monocromo.</span></figcaption></figure>
    <figure><img src="2-f-ascendente.svg" alt=""><div class="sizes"><img src="2-f-ascendente.svg" width="48" alt=""><img src="2-f-ascendente.svg" width="32" alt=""><img src="2-f-ascendente.svg" width="20" alt=""></div><figcaption><b>2 · F ascendente</b><span>La F con una línea de tendencia verde.</span></figcaption></figure>
    <figure><img src="3-orbita.svg" alt=""><div class="sizes"><img src="3-orbita.svg" width="48" alt=""><img src="3-orbita.svg" width="32" alt=""><img src="3-orbita.svg" width="20" alt=""></div><figcaption><b>3 · Órbita</b><span>El colón al centro del "OS"; fondo claro.</span></figcaption></figure>
    <figure><img src="4-monograma.svg" alt=""><div class="sizes"><img src="4-monograma.svg" width="48" alt=""><img src="4-monograma.svg" width="32" alt=""><img src="4-monograma.svg" width="20" alt=""></div><figcaption><b>4 · Monograma FO</b><span>F + O sobre degradado violeta.</span></figcaption></figure>
    <figure><img src="5-tarjeta-pulso.svg" alt=""><div class="sizes"><img src="5-tarjeta-pulso.svg" width="48" alt=""><img src="5-tarjeta-pulso.svg" width="32" alt=""><img src="5-tarjeta-pulso.svg" width="20" alt=""></div><figcaption><b>5 · Tarjeta con pulso</b><span>Tarjeta de crédito con línea de actividad.</span></figcaption></figure>
  </div>
</main>
</body>
</html>
